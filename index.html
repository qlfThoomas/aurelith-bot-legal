<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurelith Studios Bot — Legal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #fafafa;
    }
    p {
      color: #a1a1aa;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    a {
      display: block;
      padding: 0.9rem 1.25rem;
      background: #27272a;
      color: #fafafa;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 500;
      transition: background 0.15s, transform 0.15s;
      border: 1px solid #3f3f46;
    }
    a:hover {
      background: #3f3f46;
      transform: translateY(-1px);
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Aurelith Studios Bot</h1>
    <p>Legal documents for the Discord bot operated by Aurelith Studios.</p>
    <div class="links">
      <a href="terms.html">📜 Terms of Service</a>
      <a href="privacy.html">🔒 Privacy Policy</a>
    </div>
    <div class="footer">© 2026 Aurelith Studios</div>
  </div>
</body>
</html>
